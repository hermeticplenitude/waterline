<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Not found · Waterline</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: a two-material page. Paper hero with the 3D vesica, then a sand-washed measured block
   (Method, Register, Shore, Papers) and a water-washed held block (Above). Each waterline rule sits
   exactly on the boundary between two materials. Collaboration closes on paper. */
:root{
  --paper:#f7f4ee; --ink:#1c1a17; --mute:#6b655c; --rule:#d9d2c5; --card:#fbf9f5;
  --sand:#e9dfcf; --sand-deep:#c9b89c; --sand-ink:#5a4a33;
  --water:#dbe6ea; --water-deep:#7a98a6; --water-ink:#223640;
  --shore:#8f9c7a; --shore-ink:#3f4a2f; --shore-wash:#e3e7da;
  --wash-sand:#f1eadf; --wash-water:#e7eef0;
  --foam:#f7f4ee;
  --serif:'Cormorant Garamond',Georgia,'Times New Roman',serif;
  --sans:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace;
  --max:1160px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#18262d; --ink:#f1ece2; --mute:#a9b3b4; --rule:#31444c; --card:#1d2d35;
    --sand:#3a3529; --sand-deep:#8c7b5f; --sand-ink:#dccaa8;
    --water:#22343d; --water-deep:#7a98a6; --water-ink:#bcd3dc;
    --shore:#8f9c7a; --shore-ink:#d3ddbd; --shore-wash:#2c3527;
    --wash-sand:#20292a; --wash-water:#1a2d36;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#18262d; --ink:#f1ece2; --mute:#a9b3b4; --rule:#31444c; --card:#1d2d35;
  --sand:#3a3529; --sand-deep:#8c7b5f; --sand-ink:#dccaa8;
  --water:#22343d; --water-deep:#7a98a6; --water-ink:#bcd3dc;
  --shore:#8f9c7a; --shore-ink:#d3ddbd; --shore-wash:#2c3527;
  --wash-sand:#20292a; --wash-water:#1a2d36;
  color-scheme:dark;
}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.6;text-wrap:pretty;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
a{color:inherit;text-decoration:none;border-bottom:1px solid var(--rule);transition:border-color .2s}
a:hover{border-color:var(--ink)}
:focus-visible{outline:2px solid var(--water-deep);outline-offset:3px}
h1,h2,h3{font-family:var(--serif);font-weight:500;line-height:1.08;margin:0;text-wrap:balance}
em{font-style:italic}
p{margin:0}
.wrap{max-width:var(--max);margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media (min-width:760px){.wrap{padding-left:max(32px,env(safe-area-inset-left,0px));padding-right:max(32px,env(safe-area-inset-right,0px))}}
.mono{font-family:var(--mono)}
.num{font-family:var(--mono);font-size:13px;letter-spacing:.08em;color:var(--mute)}
.kicker{font-family:var(--mono);font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute)}
.note{font-size:14px;color:var(--mute);max-width:66ch}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* header */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--paper);border-bottom:1px solid var(--rule)}
nav{display:flex;align-items:center;justify-content:space-between;gap:20px;height:60px}
.brand{font-family:var(--serif);font-size:23px;border:0;display:flex;align-items:center;gap:12px}
.brand svg{width:26px;height:26px;flex:none}
nav ul{display:flex;gap:24px;list-style:none;margin:0;padding:0;font-size:14px}
nav li a{border:0;color:var(--mute)} nav li a:hover{color:var(--ink)}
.navright{display:flex;align-items:center;gap:16px}
.of{font-size:13px;color:var(--mute);border:0}
.themebtn{font:500 11px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--mute);background:transparent;border:1px solid var(--rule);padding:8px 10px;cursor:pointer;min-height:32px}
.themebtn:hover{color:var(--ink);border-color:var(--ink)}
@media (max-width:980px){nav ul{display:none}}
@media (max-width:520px){.of{display:none}}

/* hero */
.hero{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);align-items:center;gap:48px;padding-block:56px 40px}
.hero h1{font-size:clamp(56px,7.4vw,104px);letter-spacing:-.015em;font-weight:500}
.hero .kicker{display:block;margin-bottom:20px}
.lede{font-family:var(--serif);margin-top:22px;display:grid;gap:16px}
.lede-key{display:block;font-size:clamp(34px,3.9vw,50px);line-height:1.06;font-weight:500;letter-spacing:-.005em;max-width:19ch;text-wrap:balance;padding-bottom:18px;position:relative}
.lede-key em{font-weight:400}
.lede-key::after{content:"";position:absolute;left:0;bottom:0;width:min(100%,280px);height:1px;background:linear-gradient(90deg,var(--s-water,var(--water-deep)),var(--shore) 50%,var(--s-gold,var(--sand-deep)))}
.lede-rest{display:block;font-size:clamp(20px,1.9vw,24px);line-height:1.38;max-width:30ch;color:var(--s-mute,var(--mute))}
.legend{display:grid;gap:10px;margin-top:36px;font-size:14px;color:var(--mute);list-style:none;padding:0}
.legend li{display:flex;align-items:center;gap:12px}
.legend b{font-weight:500;color:var(--ink)}
.sw{width:14px;height:14px;border-radius:50%;flex:none;border:1.2px solid}
.sw.water{border-color:var(--water-ink)}
.sw.sand{border-color:var(--sand-ink);border-style:dotted;border-width:2px}
.sw.shore{background:var(--shore);border-color:var(--shore)}
.sw.moon{border-color:var(--mute);border-style:dashed}
.vesica{position:relative;margin:0;width:100%;max-width:640px;justify-self:center}
.stage{position:relative;aspect-ratio:1;width:100%;max-width:100%}
.stage svg,.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.stage canvas{touch-action:pan-y;cursor:grab;opacity:0;transition:opacity 1.2s ease}
.stage canvas:active{cursor:grabbing}
.vesica.gl-on canvas{opacity:1}
.vesica.gl-on .stage svg{opacity:0;transition:opacity .8s ease}
.vesica figcaption{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;font-family:var(--mono);font-size:11px;letter-spacing:.08em;color:var(--mute);margin-top:6px;text-transform:uppercase}
.vesica figcaption .readout{font-variant-numeric:tabular-nums}
.moonmark{transition:opacity .6s}
.no-moon .moonmark{opacity:0}
@media (max-width:860px){.hero{grid-template-columns:1fr;gap:20px;padding-block:20px 24px}.vesica{max-width:440px;order:-1}}

/* the stage: one deliberately dark, single-look band (the same in day and night) so light can glow */
.stage-band{--s-ink:#f2ede3;--s-mute:#a9b6b4;--s-water:#7fe0e6;--s-gold:#e8c27a;--s-moon:#dfe6e8;
  color:var(--s-ink);
  background:
    radial-gradient(52% 58% at 74% 40%, rgba(79,195,207,.16), transparent 70%),
    radial-gradient(42% 42% at 74% 72%, rgba(217,168,90,.12), transparent 70%),
    linear-gradient(180deg,#071820 0%,#0b2430 50%,#1c1813 100%)}
.stage-band .kicker{color:var(--s-mute)}
.stage-band .lede-key{color:var(--s-ink)}
.stage-band .legend{color:var(--s-mute)}
.stage-band .legend b{color:var(--s-ink)}
.stage-band .sw.water{border-color:var(--s-water);box-shadow:0 0 8px rgba(127,224,230,.55)}
.stage-band .sw.sand{border-color:var(--s-gold)}
.stage-band .sw.shore{box-shadow:0 0 8px rgba(143,156,122,.6)}
.stage-band .sw.moon{border-color:var(--s-moon)}
.stage-band .vesica figcaption{color:var(--s-mute)}
.stage-band .hero{padding-block:64px 48px}
@media (max-width:860px){.stage-band .hero{padding-block:16px 40px}}

/* thesis */
.thesis{padding-block:56px 72px}
.thesis p{font-family:var(--serif);font-size:clamp(26px,3.2vw,40px);line-height:1.25;max-width:30ch}
.thesis p span{display:block}
.thesis .t-true{color:var(--shore-ink)}
.thesis .tagline{display:flex;flex-wrap:wrap;gap:10px;margin-top:28px}

/* sections */
section{padding-block:96px}
section + section{border-top:1px solid var(--rule)}
.sec-head{display:grid;grid-template-columns:120px minmax(0,1fr);gap:28px;align-items:baseline;margin-bottom:44px}
.sec-head h2{font-size:clamp(36px,4.4vw,56px)}
.sec-head .num{font-size:15px}
@media (max-width:760px){.sec-head{grid-template-columns:1fr;gap:6px}section{padding-block:72px}}
.prose{max-width:64ch;font-size:18px;display:grid;gap:20px}
.cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:40px}
.cols h3{font-size:27px;margin-bottom:12px}
.cols p{color:var(--mute);font-size:16px}
@media (max-width:860px){.cols{grid-template-columns:1fr;gap:32px}}

/* the two material blocks and their waterlines */
.block-sand{background:var(--wash-sand)}
.block-water{background:var(--wash-water)}
.block-sand section + section,.block-water section + section{border-top-color:color-mix(in oklab,var(--rule) 70%,transparent)}
.line{position:relative}
.line.to-sand{background:linear-gradient(var(--paper) 50%,var(--wash-sand) 50%)}
.line.to-water{background:linear-gradient(var(--wash-sand) 50%,var(--wash-water) 50%)}
.line .wrap{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:20px;height:88px}
.line .tidewave{height:12px;width:100%;display:block;color:var(--shore)}
.line .label{display:grid;justify-items:center;gap:4px;text-align:center;background:inherit}
.line .label .kicker{color:var(--shore-ink);font-weight:500}
.line .label small{font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:var(--mute)}
@media (prefers-reduced-motion: no-preference){
  .tidewave path{animation:drift 9s ease-in-out infinite}
  @keyframes drift{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
}

/* chips */
.chip{display:inline-flex;align-items:center;gap:7px;font:500 11px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;padding:6px 9px 5px;border:1px solid;border-radius:2px;white-space:nowrap;vertical-align:middle}
.chip::before{content:"";flex:none}
.chip.drawn{color:var(--sand-ink);background:var(--sand);border-color:var(--sand-deep)}
.chip.drawn::before{width:6px;height:6px;background:currentColor}
.chip.brought{color:var(--water-ink);background:var(--water);border-color:var(--water-deep)}
.chip.brought::before{width:7px;height:7px;border-radius:50%;background:currentColor}
.chip.accord{color:var(--shore-ink);background:var(--shore-wash);border-color:var(--shore)}
.chip.accord::before{width:11px;height:7px;border-radius:50%;background:var(--shore)}
.chip.triaged{color:var(--ink);border-color:var(--ink);background:transparent}
.chip.triaged::before{width:5px;height:5px;border-radius:50%;background:currentColor;box-shadow:7px 0 0 currentColor;margin-right:7px}
.chip.untriaged{color:var(--mute);border-color:var(--mute);border-style:dashed;background:transparent}
.chip.untriaged::before{width:5px;height:5px;border-radius:50%;border:1px solid currentColor}
.chip.hold{color:var(--paper);background:var(--ink);border-color:var(--ink)}
.chip.hold::before{width:6px;height:6px;background:currentColor}
.chip.yield{color:var(--ink);background:transparent;border-color:var(--ink);border-style:dashed}
.chip.yield::before{width:0;height:0;border-left:4px solid transparent;border-right:4px solid transparent;border-top:6px solid currentColor}
.chip.spec{color:var(--mute);border-color:var(--rule);background:var(--card)}
.chip.spec::before{display:none}

/* method: dial + provenance */
.fig{margin:56px 0 0;border-top:1px solid var(--rule);padding-top:28px}
.fig-head{display:flex;justify-content:space-between;align-items:baseline;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.fig-head h3{font-size:26px}
.dial{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;max-width:820px}
.dial figure{margin:0;display:grid;justify-items:center;gap:8px;text-align:center}
.dial svg{width:100%;max-width:200px;height:auto}
.dial .d{font-family:var(--mono);font-size:13px;letter-spacing:.06em;color:var(--ink)}
.dial .w{font-family:var(--serif);font-size:21px;font-style:italic;line-height:1.2}
.dial figure.on .w{color:var(--shore-ink)}
.dial-cap{font-family:var(--serif);font-size:21px;margin-top:22px;max-width:46ch}
.prov{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--rule);border:1px solid var(--rule);margin-top:4px}
.prov > div{background:var(--wash-sand);padding:20px 20px 22px;display:grid;gap:12px;align-content:start}
.prov p{font-size:15px;color:var(--mute)}
.prov .true{font-size:13px;font-family:var(--mono);letter-spacing:.04em;color:var(--shore-ink)}
.chipset{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px;align-items:center}
.chipset .kicker{margin-right:6px}
@media (max-width:760px){.prov{grid-template-columns:1fr}}

/* register */
.tally{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:1px;background:var(--rule);border:1px solid var(--rule);max-width:820px;margin:36px 0 14px}
.tally button{all:unset;box-sizing:border-box;background:var(--wash-sand);padding:20px 18px 18px;cursor:pointer;display:grid;gap:8px;position:relative;min-height:44px}
.tally button:hover{background:var(--card)}
.tally button:focus-visible{outline:2px solid var(--water-deep);outline-offset:-2px}
.tally button[aria-pressed="true"]{background:var(--card)}
.tally button[aria-pressed="true"]::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--shore)}
.tally b{font-family:var(--serif);font-size:48px;font-weight:500;line-height:1;font-variant-numeric:tabular-nums}
.tally span{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.tally .whole{font-family:var(--serif);font-style:italic;font-size:20px}
.sealed-meta{display:flex;gap:18px;flex-wrap:wrap;font-family:var(--mono);font-size:12px;letter-spacing:.04em;color:var(--mute);max-width:820px}
.sealed{max-width:820px;margin-top:22px;border-top:1px solid var(--ink)}
.sealed-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 0}
.sealed-head h3{font-size:24px}
.sealed ol{list-style:none;margin:0;padding:0}
.sealed li{display:grid;grid-template-columns:76px 120px minmax(0,1fr);gap:16px;align-items:center;padding:12px 0;border-top:1px solid var(--rule);font-size:14px}
.sealed li .id{font-family:var(--mono);font-size:12px;color:var(--mute)}
.bar{height:9px;border-radius:1px;background:var(--rule);display:block}
.hashcell{display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:11px;color:var(--mute)}
.hashcell .bar{flex:1}
@media (max-width:600px){.sealed li{grid-template-columns:64px minmax(0,1fr)}.sealed li .txt{grid-column:1/-1}}

/* shore ledger strip */
.ledger-wrap{overflow-x:auto;margin-top:36px;border-top:1px solid var(--ink)}
.ledger{width:100%;min-width:720px;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.ledger th{font:500 10.5px/1.3 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--mute);text-align:left;padding:12px 10px 10px;border-bottom:1px solid var(--rule);white-space:nowrap}
.ledger td{padding:7px 10px;border-bottom:1px solid color-mix(in oklab,var(--rule) 60%,transparent);vertical-align:middle}
.ledger td.t{font-family:var(--mono);font-size:12px;color:var(--mute);width:56px}
.ledger .pull{display:flex;align-items:center;gap:8px;width:150px}
.ledger .pull i{display:block;height:6px;background:var(--sand-deep);border-radius:1px}
.ledger .pull span{font-family:var(--mono);font-size:11px;color:var(--mute)}
.ledger .eng{font-family:var(--mono);font-size:12px;color:var(--mute)}
.ledger .rd{font-family:var(--mono);font-size:11px;letter-spacing:.06em}
.agree{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--shore);vertical-align:middle}
.agree.no{background:transparent;border:1.5px solid var(--sand-ink)}
.ledger tbody tr:hover td{background:color-mix(in oklab,var(--card) 70%,transparent)}
.ledger .chip{padding:4px 7px 3px;font-size:10px}
.ledger-sum{display:flex;gap:28px;flex-wrap:wrap;margin-top:18px;font-family:var(--mono);font-size:12px;letter-spacing:.04em;color:var(--mute)}
.ledger-sum b{font-family:var(--serif);font-size:30px;font-weight:500;color:var(--ink);display:block;line-height:1;letter-spacing:0}
.specnote{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--mute);margin-top:14px;max-width:80ch}

/* papers */
.search{display:flex;max-width:820px;border:1px solid var(--ink);margin-top:32px;background:var(--card)}
.search input{flex:1;min-width:0;border:0;background:transparent;padding:15px 18px;font:inherit;font-size:17px;color:var(--ink);min-height:52px}
.search input::placeholder{color:var(--mute)}
.search input:focus{outline:none}
.search:focus-within{box-shadow:0 0 0 2px var(--water-deep)}
.search kbd{align-self:center;font:500 11px/1 var(--mono);border:1px solid var(--rule);padding:4px 7px;color:var(--mute);margin-right:12px}
.search button{border:0;background:var(--ink);color:var(--paper);padding:0 24px;font:500 14px var(--sans);cursor:pointer;min-width:44px}
.search button:hover{background:var(--water-ink);color:var(--foam)}
.filters{display:grid;gap:12px;margin-top:18px;max-width:820px}
.frow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.frow .kicker{width:84px;flex:none;font-size:11px}
.fchip{font:400 13px/1 var(--sans);padding:8px 12px;border:1px solid var(--rule);background:transparent;color:var(--ink);cursor:pointer;border-radius:999px;min-height:34px}
.fchip.mono{font-family:var(--mono);font-size:12px}
.fchip:hover{border-color:var(--ink)}
.fchip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.status{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center;margin-top:26px;padding:12px 14px;border:1px solid var(--rule);background:var(--card);font-family:var(--mono);font-size:12px;color:var(--mute);max-width:820px}
.status .pulse{width:8px;height:8px;border-radius:50%;background:var(--shore);display:inline-block;margin-right:8px;vertical-align:middle}
@media (prefers-reduced-motion: no-preference){.status .pulse{animation:pulse 2.4s ease-in-out infinite}@keyframes pulse{50%{opacity:.35}}}
.results{display:grid;gap:0;margin-top:8px;max-width:820px}
.card{padding:30px 0 28px;border-bottom:1px solid var(--rule);display:grid;gap:12px}
.card-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.card h3{font-size:clamp(22px,2.2vw,24px);font-weight:600;line-height:1.2}
.card h3 a{border:0} .card h3 a:hover{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:4px}
.byline{font-size:14px;color:var(--mute)}
.ids{display:flex;flex-wrap:wrap;gap:6px 14px;font-family:var(--mono);font-size:12px;color:var(--mute)}
.ids .cat{color:var(--ink)}
.abs{font-size:16px;line-height:1.65;max-width:72ch}
.pfoot{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;font-family:var(--mono);font-size:11.5px;color:var(--mute);padding-top:4px}
.pfoot a{color:var(--ink)}
.empty{padding:48px 0;border-bottom:1px solid var(--rule)}
.empty p:first-child{font-family:var(--serif);font-size:34px}
.empty p + p{margin-top:8px;font-family:var(--mono);font-size:12px;color:var(--mute)}
.more{margin-top:24px;font:500 14px var(--sans);border:1px solid var(--ink);background:transparent;color:var(--ink);padding:12px 18px;cursor:pointer;min-height:44px}
.more:hover{background:var(--ink);color:var(--paper)}
.ifoot{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--rule);border:1px solid var(--rule);margin-top:44px;max-width:820px}
.ifoot div{background:var(--wash-sand);padding:16px 16px 18px;display:grid;gap:6px;align-content:start}
.ifoot b{font-family:var(--serif);font-size:24px;font-weight:500;line-height:1.1}
.ifoot span{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
.ifoot .rule-line{grid-column:1/-1}
.ifoot .rule-line b{font-style:italic;font-size:21px}
@media (max-width:700px){.ifoot{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* above */
.held h3{font-size:30px;margin-bottom:12px}
.held p{color:var(--mute);font-size:16px}
.src{margin-top:16px;padding-top:12px;border-top:1px solid var(--rule);font-family:var(--mono);font-size:11.5px;line-height:1.55;letter-spacing:.02em;color:var(--water-ink)}
.src .k{color:var(--mute);text-transform:uppercase;letter-spacing:.12em;font-size:10.5px;display:block;margin-bottom:4px}
.src.pending{color:var(--mute)}

/* collaboration */
.values{display:flex;flex-wrap:wrap;gap:12px 28px;font-family:var(--serif);font-size:clamp(24px,2.6vw,32px);font-style:italic;margin:4px 0 40px}
.values span{display:flex;align-items:center;gap:12px}
.values span + span::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--shore)}
.doors{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));border:1px solid var(--ink);background:var(--card)}
.door{padding:32px 30px 30px;display:grid;gap:16px;align-content:start}
.door + .door{border-left:1px solid var(--ink)}
.door h3{font-size:34px}
.door .who{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.door ol{margin:0;padding-left:20px;display:grid;gap:8px;color:var(--mute);font-size:15.5px}
.door ol li::marker{font-family:var(--mono);font-size:12px}
.door .opens{font-family:var(--mono);font-size:12px;color:var(--ink);border-top:1px solid var(--rule);padding-top:14px}
.doors .rule-row{grid-column:1/-1;border-top:1px solid var(--ink);padding:16px 30px;font-family:var(--mono);font-size:12.5px;letter-spacing:.03em;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
@media (max-width:760px){.doors{grid-template-columns:1fr}.door + .door{border-left:0;border-top:1px solid var(--ink)}.door{padding:26px 20px}.doors .rule-row{padding:14px 20px}}

/* footer */
footer{border-top:1px solid var(--rule);padding-block:48px 64px;font-size:14px;color:var(--mute)}
footer .wrap{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}
footer .wrap > div{display:grid;gap:8px;align-content:start}
footer strong{color:var(--ink);font-family:var(--serif);font-size:20px;font-weight:500}
footer .creed{font-family:var(--serif);font-size:22px;color:var(--ink);font-style:italic}
@media (max-width:760px){footer .wrap{grid-template-columns:1fr}}

/* tweaks drawer (design iteration only; remove before launch) */
#tweaks{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:max(16px,env(safe-area-inset-bottom,0px));z-index:9;font-size:12px}
#tweaks summary{cursor:pointer;color:var(--mute);list-style:none;font-family:var(--mono);letter-spacing:.1em;text-transform:uppercase;background:var(--paper);border:1px solid var(--rule);padding:8px 10px}
#tweaks summary::-webkit-details-marker{display:none}
#tweaks .tw{background:var(--paper);border:1px solid var(--rule);padding:12px 14px;margin-top:6px;display:grid;gap:10px;min-width:220px}
#tweaks label{display:flex;justify-content:space-between;gap:16px;align-items:center;color:var(--ink)}
</style>
<style>.nf{min-height:70vh;display:grid;align-content:center;gap:22px;padding-block:80px}.nf h1{font-size:clamp(44px,6vw,80px)}.nf p{max-width:44ch;color:var(--mute);font-size:18px}</style>
</head>
